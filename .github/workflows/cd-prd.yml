name: CD PRODUCT

# cd-stg.yml 과 본문이 완전히 같다. 다른 것은 아래 넷뿐이다.
#   name / on.push.branches / env.deploy_env / jobs.discovery-deploy.environment
# 한쪽을 고치면 다른 쪽도 같이 고친다.

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  # 배포 대상 환경. configs 서브모듈의 deploy/<환경>/ 과 GitHub Environment 이름이 같다.
  deploy_env: product
  # 서버의 배포 디렉터리 (홈 기준). configs 의 deploy/<환경>/service/ 트리가 ~/service/ 로 간다.
  remote_dir: service/discovery

jobs:
  discovery-deploy:
    name: Discovery 배포
    runs-on: ubuntu-latest
    environment: product
    steps:
      # 소스 로드 (configs 서브모듈 포함)
      - name: 소스 코드 로드
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true

      - name: JDK 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Gradle 권한 부여
        run: chmod +x gradlew

      # 설정을 서브모듈에서 각 모듈 리소스로 복사
      - name: 환경 설정 파일 로드
        run: ./gradlew copyPrivate

      # 모듈 버전 추출
      - name: Get module versions
        id: versions
        run: |
          EUREKA_VERSION=$(./gradlew :apps:monglife-discovery-app-eureka:properties -q | grep "^version:" | awk '{print $2}')
          GATEWAY_VERSION=$(./gradlew :apps:monglife-discovery-app-gateway:properties -q | grep "^version:" | awk '{print $2}')
          COMMON_API_VERSION=$(./gradlew :apps:monglife-discovery-app-common-api:properties -q | grep "^version:" | awk '{print $2}')
          
          echo "eureka=$EUREKA_VERSION" >> "$GITHUB_OUTPUT"
          echo "gateway=$GATEWAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "common-api=$COMMON_API_VERSION" >> "$GITHUB_OUTPUT"

      # 세 앱 모듈 빌드. bootJar 이름이 <모듈명>.jar 로 고정돼 있어
      # .env 의 *_BIN_FILE 값과 그대로 맞는다.
      - name: Discovery 모듈 빌드
        run: |
          ./gradlew --no-daemon \
            :apps:monglife-discovery-app-eureka:build \
            :apps:monglife-discovery-app-gateway:build \
            :apps:monglife-discovery-app-common-api:build

      - name: 테스트 리포트 작성
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      # 서버 ~/service/discovery 에 그대로 펼쳐질 디렉터리를 만든다.
      # .env 는 **서버에서만 관리한다.** 여기서 보내면 서버의 계정 설정을 덮어쓴다.
      # 공용 ~/global/.env 도 다른 스택과 공유하는 자산이라 보내지 않는다.
      - name: 배포 산출물 구성
        run: |
          set -euo pipefail
          rm -rf deploy && mkdir -p deploy

          # 빌드한 모듈 버전. service.sh 가 읽는다(compose 는 .env 만 본다).
          printf "%s\n" \
            "MONGLIFE_DISCOVERY_EUREKA_VERSION=${{ steps.versions.outputs.eureka }}" \
            "MONGLIFE_DISCOVERY_GATEWAY_VERSION=${{ steps.versions.outputs.gateway }}" \
            "MONGLIFE_DISCOVERY_COMMON_API_VERSION=${{ steps.versions.outputs.common-api }}" \
            > deploy/.version

          src="configs/deploy/${{ env.deploy_env }}/service/discovery"

          cp "$src/docker-compose.yml"      deploy/
          cp "$src/spring-boot-docker-file" deploy/
          cp "$src/.dockerignore"           deploy/
          cp "$src/.compose"                deploy/
          cp "$src/service.sh"              deploy/
          chmod +x deploy/*.sh

          for module in monglife-discovery-app-eureka \
                        monglife-discovery-app-gateway \
                        monglife-discovery-app-common-api
          do
            cp "apps/${module}/build/libs/${module}.jar" deploy/
          done

          ls -al deploy

      # deploy/ 한 겹만 벗겨 ~/service/discovery 아래로
      - name: 배포 산출물 서버로 전송
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/*,deploy/.dockerignore,deploy/.compose,deploy/.version"
          target: "~/${{ env.remote_dir }}"
          strip_components: 1
          overwrite: true
          timeout: '600s'

      - name: Discovery 서비스 기동
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: '30m'
          script: |
            cd ~/${{ env.remote_dir }}

            # 사전 검사(필수 키·로그 디렉터리·네트워크·jar 존재)와 기동 확인은 모두
            # service.sh 가 한다. 서버에서 손으로 돌릴 때도 같은 검사를 받도록 한곳에 모았다.
            # scp 가 실행 비트를 보존하지 못하는 경우가 있어 다시 세운다.
            chmod +x ./service.sh

            # ssh-action 의 script_stop 에 기대지 않고 종료 코드를 직접 본다.
            # 마지막 명령(prune)의 코드가 스텝 결과가 되어 버려서, 기동이 1 로 끝나도
            # "Successfully executed" 로 초록불이 뜬 적이 있다.
            if ! ./service.sh up; then
              echo "::error::discovery 스택 기동에 실패했습니다. 위 컨테이너 로그를 확인하세요."
              exit 1
            fi

            # dangling 이미지만 정리 (-a 는 같은 서버의 다른 서비스 이미지까지 지운다)
            docker image prune -f
