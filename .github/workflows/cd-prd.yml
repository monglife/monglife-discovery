name: CD PRODUCT

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  # configs 서브모듈 안의 prd 배포 자산
  compose_dir: configs/docker/prd/discovery
  # PRODUCT 서버의 배포 디렉터리 (홈 기준). .env 의 DOCKER_FILE_DIR 과 같아야 한다.
  remote_dir: service/discovery

jobs:
  discovery-deploy:
    name: Discovery PRODUCT 배포
    runs-on: ubuntu-latest
    environment: product
    steps:
      # 소스 로드 (configs 서브모듈 포함)
      - name: 소스 코드 로드
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true

      - name: JDK 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Gradle 권한 부여
        run: chmod +x gradlew

      # 설정을 서브모듈에서 각 모듈 리소스로 복사
      - name: 환경 설정 파일 로드
        run: ./gradlew copyPrivate

      # 세 앱 모듈 빌드. bootJar 이름이 <모듈명>.jar 로 고정돼 있어
      # .env 의 *_BIN_FILE 값과 그대로 맞는다.
      - name: Discovery 모듈 빌드
        run: |
          ./gradlew --no-daemon \
            :apps:monglife-discovery-app-eureka:build \
            :apps:monglife-discovery-app-gateway:build \
            :apps:monglife-discovery-app-common-api:build

      - name: 테스트 리포트 작성
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      # 서버 ~/service/discovery 에 그대로 펼쳐질 디렉터리를 만든다. .env 는 포함하지 않는다.
      - name: 배포 산출물 구성
        run: |
          set -euo pipefail
          rm -rf deploy && mkdir -p deploy

          cp "${{ env.compose_dir }}/docker-compose.yml"      deploy/
          cp "${{ env.compose_dir }}/spring-boot-docker-file"  deploy/
          cp "${{ env.compose_dir }}/.dockerignore"            deploy/

          for module in monglife-discovery-app-eureka \
                        monglife-discovery-app-gateway \
                        monglife-discovery-app-common-api
          do
            cp "apps/${module}/build/libs/${module}.jar" deploy/
          done

          ls -al deploy

      # deploy/ 한 겹만 벗겨 ~/service/discovery 아래로 (.env 는 건드리지 않는다)
      - name: 배포 산출물 PRODUCT 서버로 전송
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/*,deploy/.dockerignore"
          target: "~/${{ env.remote_dir }}"
          strip_components: 1
          overwrite: true
          timeout: '600s'

      - name: Discovery 서비스 기동
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: '20m'
          script: |
            cd ~/${{ env.remote_dir }}

            # .env 는 서버에서만 관리한다. 없으면 compose 가 빈 문자열로 치환해
            # ":8761" 같은 잘못된 포트 매핑으로 조용히 깨지므로 여기서 끊는다.
            if [ ! -f .env ]; then
              echo "::error::~/${{ env.remote_dir }}/.env 가 없습니다. 서버에서 ~/service/discovery/setup.sh 를 먼저 실행하세요."
              exit 1
            fi

            set -a
            . ./.env
            set +a

            # compose 가 참조하는 필수 키 검증
            for key in DOCKER_FILE_DIR EUREKA_BIN_FILE GATEWAY_BIN_FILE COMMON_BIN_FILE \
                       EUREKA_LOG GATEWAY_LOG COMMON_LOG \
                       MYSQL_HOST REDIS_HOST KAFKA_HOST; do
              eval "value=\${$key:-}"
              if [ -z "$value" ]; then
                echo "::error::.env 에 $key 가 비어 있습니다."
                exit 1
              fi
            done

            # 빌드 컨텍스트가 DOCKER_FILE_DIR 이므로 jar 을 보낸 곳과 같아야 한다
            if [ "$DOCKER_FILE_DIR" != "$(pwd)" ]; then
              echo "::error::DOCKER_FILE_DIR($DOCKER_FILE_DIR) 이 배포 디렉터리($(pwd)) 와 다릅니다."
              exit 1
            fi

            mkdir -p "$EUREKA_LOG" "$GATEWAY_LOG" "$COMMON_LOG"

            # 리버스 프록시와 공유하는 external 네트워크. 없으면 만든다.
            docker network inspect service-net >/dev/null 2>&1 || docker network create service-net

            # MySQL / Redis / Kafka 가 올라가 있는 기존 네트워크. 여기서 만들면 안 된다.
            # 빈 네트워크가 생기면 컨테이너 이름 DNS 가 조용히 실패한다.
            if ! docker network inspect storage-net >/dev/null 2>&1; then
              echo "::error::네트워크 storage-net 이 없습니다. MySQL/Redis/Kafka 스택을 먼저 올리세요."
              exit 1
            fi

            # .env 의 *_HOST 가 storage-net 위에 실제로 있는지 (오타/이름 불일치 조기 발견)
            members=$(docker network inspect storage-net --format '{{range .Containers}}{{.Name}} {{end}}')
            for host in "$MYSQL_HOST" "$REDIS_HOST" "$KAFKA_HOST"; do
              case " $members " in
                *" $host "*) ;;
                *) echo "::warning::$host 가 storage-net 에 없습니다. (현재: $members)" ;;
              esac
            done

            # 레지스트리 → 게이트웨이 → API 순서로 교체
            docker compose up -d --build monglife-discovery-eureka
            docker compose up -d --build monglife-discovery-gateway
            docker compose up -d --build monglife-discovery-common-api

            # dangling 이미지만 정리 (-a 는 같은 서버의 다른 서비스 이미지까지 지운다)
            docker image prune -f

            docker compose ps
