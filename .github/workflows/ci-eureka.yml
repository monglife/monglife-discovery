name: CI EUREKA

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build-test:
    name: Discovery Eureka 빌드 테스트
    runs-on: ubuntu-latest
    steps:
      # 소스 로드 (configs 서브모듈 포함)
      - name: 소스 코드 로드
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true

      - name: JDK 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Gradle 권한 부여
        run: chmod +x gradlew

      # 설정을 서브모듈에서 각 모듈 리소스로 복사
      - name: 환경 설정 파일 로드
        run: ./gradlew copyPrivate

      - name: Discovery Eureka 모듈 빌드
        run: ./gradlew --no-daemon :apps:monglife-discovery-app-eureka:build
