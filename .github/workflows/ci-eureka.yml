name: CI EUREKA

# 실제 처리 과정은 .github/actions/ci/build-test 에 있다. 세 ci-*.yml 이 같은 액션을 쓰고
# modules / test_report 만 다르다. 이 파일은 트리거와 job 배선만 가진다.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build-test:
    name: Discovery Eureka 빌드 테스트
    runs-on: ubuntu-latest
    steps:
      # 소스 로드 (configs 서브모듈 포함)
      - name: 소스 코드 로드
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true

      - name: Discovery Eureka 빌드 테스트
        uses: ./.github/actions/ci/build-test
        with:
          modules: eureka
          test_report: 'false'
