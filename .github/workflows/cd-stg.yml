name: CD STAGE
on:
  push:
    branches:
      - stage
      - develop
permissions:
  contents: read
  checks: write
  pull-requests: write
env:
  common-path: ./apps/monglife-discovery-app-common-api
  gateway-path: ./apps/monglife-discovery-app-gateway
  common: monglife-discovery-common-api
  gateway: monglife-discovery-gateway
  service-path: ~/service/discovery
  service-script: ~/service/discovery/run.sh
jobs:
  # Discovery Common API 빌드 및 배포
  common-build-and-deploy:
    runs-on: ubuntu-latest
    environment: stage
    steps:
      # 소스 로드
      - name: 소스 코드 로드
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true
      # Java 환경 설정
      - name: JDK 설정
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      # gradlew 권한 변경
      - name: Gradle 권한 부여
        run: chmod +x gradlew
      # 환경 설정 파일 로드
      - name: 환경 설정 파일 로드
        run: ./gradlew copyPrivate
      # Discovery Common API 빌드
      - name: Discovery Common API 모듈 빌드
        run: ./gradlew :apps:monglife-discovery-app-common-api:build
      # 레포트 생성
      - name: 테스트 리포트 작성
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
      # 배포 파일 원격 복사
      - name: Discovery Common API 배포 파일 STAGE 서버로 전송
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: "${{ env.common-path }}/build/libs/*.jar"
          target: "${{ env.service-path }}/${{ env.common }}"
          strip_components: 4
      # 배포 스크립트 실행
      - name: Discovery Common API 서비스 실행
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            sh ${{ env.service-script }} ${{ env.common }} ${{ env.service-path }}/${{ env.common }}
  # Discovery Gateway 빌드 및 배포
  gateway-build-and-deploy:
    runs-on: ubuntu-latest
    environment: stage
    steps:
      # 소스 로드
      - name: 소스 코드 로드
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true
      # Java 환경 설정
      - name: JDK 설정
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      # gradlew 권한 변경
      - name: Gradle 권한 부여
        run: chmod +x gradlew
      # 환경 설정 파일 로드
      - name: 환경 설정 파일 로드
        run: ./gradlew copyPrivate
      # Discovery Gateway 빌드
      - name: Discovery Gateway 모듈 빌드
        run: ./gradlew :apps:monglife-discovery-app-gateway:build
      # 레포트 생성
      - name: 테스트 리포트 작성
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
      # 배포 파일 원격 복사
      - name: Discovery Gateway 배포 파일 STAGE 서버로 전송
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: "${{ env.gateway-path }}/build/libs/*.jar"
          target: "${{ env.service-path }}/${{ env.gateway }}"
          strip_components: 4
          timeout: 120s
      # 배포 스크립트 실행
      - name: Discovery Gateway 서비스 실행
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            sh ${{ env.service-script }} ${{ env.gateway }} ${{ env.service-path }}/${{ env.gateway }}