name: CD STAGE

on:
  push:
    branches:
      - stage
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  # configs 서브모듈 안의 stg 배포 자산(docker-compose.yml, Dockerfile) 위치
  compose_dir: configs/docker/stg/service/discovery
  # STAGE 서버의 배포 디렉터리 (홈 기준)
  service_path: service/discovery

jobs:
  discovery-deploy:
    name: Discovery STAGE 배포
    runs-on: ubuntu-latest
    environment: stage
    steps:
      # 소스 로드 (configs 서브모듈 포함)
      - name: 소스 코드 로드
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true

      # Java 환경 설정
      - name: JDK 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Gradle 권한 부여
        run: chmod +x gradlew

      # 설정을 서브모듈에서 각 모듈 리소스로 복사
      - name: 환경 설정 파일 로드
        run: ./gradlew copyPrivate

      # 세 앱 모듈 빌드 (bootJar 이름은 <모듈명>.jar 로 고정돼 있다)
      - name: Discovery 모듈 빌드
        run: |
          ./gradlew --no-daemon \
            :apps:monglife-discovery-app-eureka:build \
            :apps:monglife-discovery-app-gateway:build \
            :apps:monglife-discovery-app-common-api:build

      - name: 테스트 리포트 작성
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      # docker-compose.yml + 서비스별 Dockerfile + jar 을 서버 디렉터리 구조 그대로 모은다
      - name: 배포 산출물 구성
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          cp "${{ env.compose_dir }}/docker-compose.yml" deploy/

          # "<gradle 모듈명>:<compose 서비스명>"
          for pair in \
            "monglife-discovery-app-eureka:monglife-discovery-eureka" \
            "monglife-discovery-app-gateway:monglife-discovery-gateway" \
            "monglife-discovery-app-common-api:monglife-discovery-common-api"
          do
            module="${pair%%:*}"
            service="${pair##*:}"
            mkdir -p "deploy/${service}"
            cp "${{ env.compose_dir }}/${service}/Dockerfile" "deploy/${service}/"
            cp "apps/${module}/build/libs/${module}.jar" "deploy/${service}/"
          done

          find deploy -type f -printf '%p\t%s\n'

      # 배포 산출물 원격 복사 (deploy/ 한 겹만 벗겨 ~/service/discovery 아래로)
      - name: 배포 산출물 STAGE 서버로 전송
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: "deploy/*"
          target: "~/${{ env.service_path }}"
          strip_components: 1
          overwrite: true
          timeout: '600s'

      # docker compose 로 재빌드 + 기동
      - name: Discovery 서비스 기동
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script_stop: true
          command_timeout: '20m'
          script: |
            cd ~/${{ env.service_path }}

            # compose 가 external 로 참조하는 네트워크 (없으면 up 이 실패한다)
            for net in discovery-net storage-net; do
              docker network inspect "$net" >/dev/null 2>&1 || docker network create "$net"
            done

            # 볼륨 마운트 대상 로그 디렉터리
            mkdir -p logs/monglife-discovery-eureka \
                     logs/monglife-discovery-gateway \
                     logs/monglife-discovery-common-api

            # 레지스트리 → 게이트웨이 → API 순서로 교체
            docker compose up -d --build monglife-discovery-eureka
            docker compose up -d --build monglife-discovery-gateway
            docker compose up -d --build monglife-discovery-common-api

            # dangling 이미지만 정리 (-a 는 다른 서비스 이미지까지 지운다)
            docker image prune -f

            docker compose ps
