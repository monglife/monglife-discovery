name: CD TEST (임시)

on:
  push:
    branches:
      - feature/cd-stg-docker-compose
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  # 배포 대상 환경. configs 서브모듈의 deploy/<환경>/ 과 GitHub Environment 이름이 같다.
  deploy_env: stage
  # 서버의 배포 디렉터리 (홈 기준). configs 의 deploy/<환경>/service/ 트리가 ~/service/ 로 간다.
  remote_dir: service/discovery

jobs:
  # 배포 전 게이트. 테스트가 깨지면 deploy job 이 아예 시작되지 않아
  # 서버에 SSH 로 붙기 전에 멈춘다.
  ci:
    name: 빌드·테스트
    runs-on: ubuntu-latest
    # environment 를 걸지 않는다. ci-*.yml 세 개가 environment 없이 secrets.ACTION_TOKEN 으로
    # 프라이빗 서브모듈을 받고 있으므로 ACTION_TOKEN 은 저장소(또는 org) 레벨 시크릿이다.
    # 덕분에 배포 시크릿(HOST/SSH_KEY)은 아래 deploy job 에만 노출된다.
    # 만약 여기서 서브모듈 체크아웃이 실패하면 ACTION_TOKEN 이 Environment 에만 있다는 뜻이니
    # 이 job 에도 environment 를 붙인다(값은 아래 deploy job 과 같다).
    outputs:
      eureka: ${{ steps.build.outputs.eureka_version }}
      gateway: ${{ steps.build.outputs.gateway_version }}
      common_api: ${{ steps.build.outputs.common_api_version }}
    steps:
      # 소스 로드 (configs 서브모듈 포함)
      - name: 소스 코드 로드
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true

      # 빌드·테스트하고 jar 세 개를 artifact 로 올린다.
      - name: Discovery 빌드·테스트
        id: build
        uses: ./.github/actions/ci/build-test
        with:
          artifact_name: discovery-jars

  deploy:
    name: Discovery 배포
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ env.deploy_env }}
    steps:
      # configs 서브모듈의 배포 자산이 필요하다. 소스는 다시 받지만 빌드는 하지 않는다.
      - name: 소스 코드 로드
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true

      - name: 빌드 산출물 내려받기
        uses: actions/download-artifact@v4
        with:
          name: discovery-jars
          path: jars

      - name: Discovery 배포
        uses: ./.github/actions/cd/deploy
        with:
          deploy_env: ${{ env.deploy_env }}
          remote_dir: ${{ env.remote_dir }}
          jar_dir: jars
          eureka_version: ${{ needs.ci.outputs.eureka }}
          gateway_version: ${{ needs.ci.outputs.gateway }}
          common_api_version: ${{ needs.ci.outputs.common_api }}
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          ssh_key: ${{ secrets.SSH_KEY }}
