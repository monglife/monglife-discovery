name: CD TEST (임시)

# cd-prd.yml 의 복제본. PRODUCT 배포를 이 브랜치에서 검증하기 위한 임시 워크플로다.
# **검증이 끝나면 지운다.**
#
# ⚠ 실제 운영 환경(environment: product, configs/deploy/product)으로 배포한다.
#   cd-prd.yml 과 다른 것은 name 과 트리거 브랜치뿐이다.
#
# workflow_dispatch 버튼은 워크플로 파일이 **기본 브랜치(main)** 에 있어야 UI 에 뜬다.
# 그래서 이 브랜치 push 로도 돌게 해 둔다.

on:
  push:
    branches:
      - feature/cd-stg-docker-compose
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  # 배포 대상 환경. configs 서브모듈의 deploy/<환경>/ 과 GitHub Environment 이름이 같다.
  deploy_env: product
  # 서버의 배포 디렉터리 (홈 기준). configs 의 deploy/<환경>/service/ 트리가 ~/service/ 로 간다.
  remote_dir: service/discovery
  # 스택 공용 환경변수(파일 이름은 .env). nginx·storage 스택과 공유하고
  # BASE_LOG_PATH / BASE_TIME_ZONE 이 여기서 온다.
  # 이 워크플로는 전송하지 않고 존재 여부만 확인한다. → configs/deploy/<환경>/global/.env
  remote_global_env: global/.env

jobs:
  discovery-deploy:
    name: Discovery 배포
    runs-on: ubuntu-latest
    environment: product
    steps:
      # 소스 로드 (configs 서브모듈 포함)
      - name: 소스 코드 로드
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true

      - name: JDK 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Gradle 권한 부여
        run: chmod +x gradlew

      # 설정을 서브모듈에서 각 모듈 리소스로 복사
      - name: 환경 설정 파일 로드
        run: ./gradlew copyPrivate

      # 모듈 버전 추출
      - name: Get module versions
        id: versions
        run: |
          EUREKA_VERSION=$(./gradlew :apps:monglife-discovery-app-eureka:properties -q | grep "^version:" | awk '{print $2}')
          GATEWAY_VERSION=$(./gradlew :apps:monglife-discovery-app-gateway:properties -q | grep "^version:" | awk '{print $2}')
          COMMON_API_VERSION=$(./gradlew :apps:monglife-discovery-app-common-api:properties -q | grep "^version:" | awk '{print $2}')
          
          echo "eureka=$EUREKA_VERSION" >> "$GITHUB_OUTPUT"
          echo "gateway=$GATEWAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "common-api=$COMMON_API_VERSION" >> "$GITHUB_OUTPUT"
          
          printf "%s\n" \
            "MONGLIFE_DISCOVERY_EUREKA_VERSION=${{ steps.versions.outputs.eureka }}" \
            "MONGLIFE_DISCOVERY_GATEWAY_VERSION=${{ steps.versions.outputs.gateway }}" \
            "MONGLIFE_DISCOVERY_COMMON_API_VERSION=${{ steps.versions.outputs.common-api }}"

      # 세 앱 모듈 빌드. bootJar 이름이 <모듈명>.jar 로 고정돼 있어
      # .env 의 *_BIN_FILE 값과 그대로 맞는다.
      - name: Discovery 모듈 빌드
        run: |
          ./gradlew --no-daemon \
            :apps:monglife-discovery-app-eureka:build \
            :apps:monglife-discovery-app-gateway:build \
            :apps:monglife-discovery-app-common-api:build

      - name: 테스트 리포트 작성
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      # 서버 ~/service/discovery 에 그대로 펼쳐질 디렉터리를 만든다.
      # 이 스택의 .env 는 configs 에서 관리하므로 함께 보낸다(서버 파일을 덮어쓴다).
      # 공용 ~/global/.env 는 별도 스택 자산이라 보내지 않는다.
      - name: 배포 산출물 구성
        run: |
          set -euo pipefail
          rm -rf deploy && mkdir -p deploy
          
          # .version 파일 생성
          printf "%s\n" \
          "MONGLIFE_DISCOVERY_EUREKA_VERSION=${{ steps.versions.outputs.eureka }}" \
          "MONGLIFE_DISCOVERY_GATEWAY_VERSION=${{ steps.versions.outputs.gateway }}" \
          "MONGLIFE_DISCOVERY_COMMON_API_VERSION=${{ steps.versions.outputs.common-api }}" \
          > deploy/.version

          src="configs/deploy/${{ env.deploy_env }}/service/discovery"

          cp "$src/docker-compose.yml"      deploy/
          cp "$src/spring-boot-docker-file" deploy/
          cp "$src/.dockerignore"           deploy/
          cp "$src/.env"                    deploy/
          cp "$src/startup.sh"              deploy/
          cp "$src/shutdown.sh"             deploy/
          cp "$src/process.sh"              deploy/
          cp "$src/logs.sh"                 deploy/
          chmod +x deploy/*.sh

          for module in monglife-discovery-app-eureka \
                        monglife-discovery-app-gateway \
                        monglife-discovery-app-common-api
          do
            cp "apps/${module}/build/libs/${module}.jar" deploy/
          done

          ls -al deploy

      # deploy/ 한 겹만 벗겨 ~/service/discovery 아래로
      - name: 배포 산출물 서버로 전송
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/*,deploy/.dockerignore,deploy/.env,deploy/.version"
          target: "~/${{ env.remote_dir }}"
          strip_components: 1
          overwrite: true
          timeout: '600s'

      - name: Discovery 서비스 기동
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: '30m'
          script: |
            cd ~/${{ env.remote_dir }}

            # 공용 환경변수. 없으면 compose 가 BASE_LOG_PATH 를 빈 문자열로 치환해
            # 볼륨이 "/monglife-discovery-eureka" 로 잡히므로 여기서 끊는다.
            if [ ! -f ~/${{ env.remote_global_env }} ]; then
              echo "::error::~/${{ env.remote_global_env }} 가 없습니다. global 스택을 먼저 배치하세요."
              exit 1
            fi

            set -a
            . ~/${{ env.remote_global_env }}
            . ./.env
            . ./.version
            set +a

            # compose 가 참조하는 필수 키 검증. 비어 있으면 compose 는 경고만 내고 진행해
            # ":8761" 같은 잘못된 포트 매핑으로 조용히 깨진다.
            for key in BASE_LOG_PATH \
                       MYSQL_HOST MYSQL_PORT DB_USERNAME DB_PASSWORD \
                       REDIS_HOST REDIS_PORT REDIS_PASSWORD KAFKA_HOST KAFKA_PORT \
                       EUREKA_PORT EUREKA_METRIC_PORT EUREKA_BIN_FILE EUREKA_SERVICE_OPTS \
                       GATEWAY_PORT GATEWAY_METRIC_PORT GATEWAY_BIN_FILE GATEWAY_SERVICE_OPTS \
                       COMMON_PORT COMMON_METRIC_PORT COMMON_BIN_FILE COMMON_SERVICE_OPTS; do
              eval "value=\${$key:-}"
              if [ -z "$value" ]; then
                echo "::error::.env 에 $key 가 비어 있습니다."
                exit 1
              fi
            done

            # TZ 는 비어도 컨테이너가 UTC 로 뜨기만 하므로 경고까지만 한다.
            if [ -z "${BASE_TIME_ZONE:-}" ]; then
              echo "::warning::BASE_TIME_ZONE 이 비어 있습니다. 컨테이너 TZ 가 UTC 가 됩니다."
            fi

            # jar 이 compose 의 build.args.TARGET_JAR 와 이름이 맞는지 (빌드 컨텍스트가 이 디렉터리다)
            for jar in "$EUREKA_BIN_FILE" "$GATEWAY_BIN_FILE" "$COMMON_BIN_FILE"; do
              if [ ! -f "./$jar" ]; then
                echo "::error::$jar 이 $(pwd) 에 없습니다."
                exit 1
              fi
            done

            # 로그 볼륨. 먼저 만들지 않으면 도커가 root 소유로 만든다.
            mkdir -p "$BASE_LOG_PATH/monglife-discovery-eureka" \
                     "$BASE_LOG_PATH/monglife-discovery-gateway" \
                     "$BASE_LOG_PATH/monglife-discovery-common-api"

            # 리버스 프록시(nginx 스택)와 공유하는 external 네트워크. 없으면 만든다.
            docker network inspect service-net >/dev/null 2>&1 || docker network create service-net

            # MySQL / Redis / Kafka 가 올라가 있는 기존 네트워크. 여기서 만들면 안 된다.
            # 빈 네트워크가 생기면 컨테이너 이름 DNS 가 조용히 실패한다.
            if ! docker network inspect storage-net >/dev/null 2>&1; then
              echo "::error::네트워크 storage-net 이 없습니다. MySQL/Redis/Kafka 스택을 먼저 올리세요."
              exit 1
            fi

            # .env 의 *_HOST 가 storage-net 위에 실제로 있는지 (오타/이름 불일치 조기 발견)
            members=$(docker network inspect storage-net --format '{{range .Containers}}{{.Name}} {{end}}')
            for host in "$MYSQL_HOST" "$REDIS_HOST" "$KAFKA_HOST"; do
              case " $members " in
                *" $host "*) ;;
                *) echo "::warning::$host 가 storage-net 에 없습니다. (현재: $members)" ;;
              esac
            done

            # 기동은 스택이 들고 있는 스크립트에 맡긴다.
            # startup.sh 가 down → up -d --build 후 컨테이너 상태까지 확인하고,
            # 기동에 실패하면 로그를 찍고 비정상 종료한다(그래야 이 스텝이 실패한다).
            # scp 가 실행 비트를 보존하지 못하는 경우가 있어 다시 세운다.
            chmod +x ./startup.sh ./shutdown.sh ./process.sh

            # ssh-action 의 script_stop 에 기대지 않고 종료 코드를 직접 본다.
            # 마지막 명령(prune)의 코드가 스텝 결과가 되어 버려서, startup.sh 가
            # 1 로 끝나도 "Successfully executed" 로 초록불이 뜬 적이 있다.
            if ! ./startup.sh; then
              echo "::error::discovery 스택 기동에 실패했습니다. 위 컨테이너 로그를 확인하세요."
              exit 1
            fi

            # dangling 이미지만 정리 (-a 는 같은 서버의 다른 서비스 이미지까지 지운다)
            docker image prune -f
