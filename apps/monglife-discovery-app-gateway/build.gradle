dependencies {
    // monglife-logging
    implementation("com.github.monglife.monglife-module-common:monglife-module-common-logging:${monglifeModuleCommonVersion}") {
        exclude group: 'com.fasterxml.jackson.datatype', module: 'jackson-datatype-hibernate6'
    }
    implementation "net.logstash.logback:logstash-logback-encoder:${logstashVersion}"

    // spring
    implementation "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client"
    implementation "org.springframework.cloud:spring-cloud-starter-gateway"

    // gateway
    implementation "org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j"
    implementation "io.github.resilience4j:resilience4j-bom:1.7.0"
    developmentOnly "org.springframework.boot:spring-boot-devtools"

    // lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}