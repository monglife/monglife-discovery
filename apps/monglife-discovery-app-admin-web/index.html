<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>MongLife Admin</title>
    <script>
      // 첫 페인트 전에 테마 적용 (기본 다크). Header.tsx 의 useTheme 과 같은 규칙.
      try {
        if (localStorage.getItem('monglife.admin.theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
