plugins {
    id "java-library"
    id "org.springframework.boot"        version "${springBootVersion}"
    id "io.spring.dependency-management" version "${springDependencyManagementVersion}"
}

bootJar {
    enabled(false)
}

subprojects {
    apply plugin: "java-library"
    apply plugin: "org.springframework.boot"
    apply plugin: "io.spring.dependency-management"

    // 실행 JDK 와 무관하게 17 바이트코드를 낸다. 배포 이미지가 eclipse-temurin:17-jre 라
    // 21 로 컴파일되면 UnsupportedClassVersionError 로 기동에 실패한다.
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    jar {
        enabled(false)
    }

    bootJar {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        archiveFileName = "${project.name}.jar"
        enabled(true)
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2022.0.3"
        }
    }

    dependencies {
        // monglife-core
        implementation "com.github.monglife:monglife-core:${monglifeCoreVersion}"

        // prometheus
        implementation "org.springframework.boot:spring-boot-starter-actuator:${acuatorVersion}"
        runtimeOnly "io.micrometer:micrometer-registry-prometheus"
    }
}