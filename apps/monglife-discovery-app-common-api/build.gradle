dependencies {
    // spring
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // jwt
    implementation group: 'io.jsonwebtoken', name: 'jjwt-api', version: '0.11.5'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-impl', version: '0.11.5'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-jackson', version: '0.11.5'

    // prometheus
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // modules
    implementation 'com.github.monglife.monglife-module-common:monglife-module-common-kafka:1.0.0'

    // clients
    implementation project(':clients:monglife-discovery-client-fcm')

    // domains
    implementation project(':domains:monglife-discovery-domain-account')
    implementation project(':domains:monglife-discovery-domain-device')
}

tasks.register('copyPrivate', Copy) {
    copy {
        from '../../configs/apps/monglife-discovery-app-common-api/'
        include 'application*.yml'
        into 'src/main/resources'
    }
}
